name: Deploy to GKE

on:
  push:
    branches: [main]
    paths:
      - 'src/flagd/demo.flagd.json'
      - 'src/payment/**'
      - 'deploy/gke/**'
      - '.github/workflows/deploy-gke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gke
  cancel-in-progress: false

env:
  NAMESPACE: otel-demo
  RELEASE: otel-demo
  CHART_VERSION: 0.42.6

jobs:
  deploy:
    if: github.repository == 'mharner33/opentelemetry-demo'
    runs-on: ubuntu-latest
    environment: gke-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            flags:
              - 'src/flagd/demo.flagd.json'
            app:
              - 'src/payment/**'
              - 'deploy/gke/**'
              - '.github/workflows/deploy-gke.yml'

      - name: Decide what to deploy
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FLAGS: ${{ steps.filter.outputs.flags }}
          APP: ${{ steps.filter.outputs.app }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then FLAGS=true; APP=true; fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395  # v3.0.0
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Sync feature flags ConfigMap
        if: steps.plan.outputs.flags == 'true' || steps.plan.outputs.app == 'true'
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create configmap demo-flagd-config \
            --from-file=demo.flagd.json=src/flagd/demo.flagd.json \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Log in to Artifact Registry
        if: steps.plan.outputs.app == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        if: steps.plan.outputs.app == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push payment image
        if: steps.plan.outputs.app == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: src/payment/Dockerfile
          push: true
          tags: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/otel-demo/payment:${{ steps.plan.outputs.short_sha }}
          cache-from: type=gha,scope=payment
          cache-to: type=gha,mode=max,scope=payment

      - name: Set up Helm
        if: steps.plan.outputs.app == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Helm upgrade
        if: steps.plan.outputs.app == 'true'
        env:
          IMAGE_REPO: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/otel-demo/payment
          IMAGE_TAG: ${{ steps.plan.outputs.short_sha }}
        run: |
          cat > "$RUNNER_TEMP/payment-values.yaml" <<EOF
          components:
            payment:
              imageOverride:
                repository: ${IMAGE_REPO}
                tag: ${IMAGE_TAG}
              envOverrides:
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: service.version=${IMAGE_TAG},deployment.environment.name=gke-demo,service.criticality=critical
          EOF
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm upgrade --install "$RELEASE" open-telemetry/opentelemetry-demo \
            --namespace "$NAMESPACE" \
            --version "$CHART_VERSION" \
            --values deploy/gke/values.yaml \
            --values "$RUNNER_TEMP/payment-values.yaml" \
            --wait --timeout 10m

      - name: Restart flagd to load new flags
        if: steps.plan.outputs.flags == 'true'
        run: |
          kubectl -n "$NAMESPACE" rollout restart deployment/flagd
          kubectl -n "$NAMESPACE" rollout status deployment/flagd --timeout 3m
